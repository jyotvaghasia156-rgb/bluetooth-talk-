<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00ffcc" stroke-width="12"/>
  
  <!-- Glowing Center Antenna / Radio Waves -->
  <circle cx="256" cy="270" r="45" fill="url(#neonCyan)"/>
  
  <!-- Radar Wave Rings -->
  <path d="M 170 180 A 120 120 0 0 1 342 180" fill="none" stroke="#00ffcc" stroke-width="18" stroke-linecap="round"/>
  <path d="M 120 130 A 180 180 0 0 1 392 130" fill="none" stroke="#00ffcc" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
  <path d="M 70 80 A 240 240 0 0 1 442 80" fill="none" stroke="#00ffcc" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
  
  <!-- Walkie-Talkie Base Base lines -->
  <path d="M 210 360 L 302 360" stroke="#00ffcc" stroke-width="14" stroke-linecap="round"/>
  <path d="M 230 400 L 282 400" stroke="#00ffcc" stroke-width="14" stroke-linecap="round"/>
</svg>
